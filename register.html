<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | ResultVue</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --logo-blue: #12224A; --logo-green: #00A651; --logo-orange: #F58220; --bg-light: #F4F7F9; }
        body { background-color: var(--bg-light); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .register-container { max-width: 650px; margin: 40px auto; background: white; padding: 40px 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-top: 5px solid var(--logo-green); }
        .btn-submit { background-color: var(--logo-blue); color: white; border: none; padding: 14px; font-weight: bold; width: 100%; border-radius: 6px; transition: 0.3s; font-size: 15px; text-transform: uppercase; letter-spacing: 1px;}
        .btn-submit:hover { background-color: #0A1430; transform: translateY(-2px); }
        .form-label { font-weight: 600; color: #444; font-size: 13px; }
        .form-control, .form-select { border-radius: 6px; padding: 12px; font-size: 14px; border: 1px solid #ddd; background: #fafafa; }
        .form-control:focus, .form-select:focus { border-color: var(--logo-green); box-shadow: 0 0 0 3px rgba(0, 166, 81, 0.1); background: #fff;}
        .header-text { text-align: center; margin-bottom: 30px; }
        .header-text img { height: 50px; margin-bottom: 15px; }
        .header-text h2 { color: var(--logo-blue); font-weight: 800; font-size: 24px; }
        .header-text p { color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="register-container">
            <div class="header-text">
                <a href="index.html"><img src="images/logo.png" alt="ResultVue"></a>
                <h2>Register your Institution</h2>
                <p>താഴെ കാണുന്ന വിവരങ്ങൾ നൽകുക. ഞങ്ങളുടെ പ്രതിനിധി ഉടൻ തന്നെ നിങ്ങളെ ബന്ധപ്പെടുന്നതാണ്.</p>
            </div>
            <form id="registerForm" onsubmit="submitForm(event)">
                <div class="row g-3">
                    <div class="col-md-12">
                        <label class="form-label">Institute Name *</label>
                        <input type="text" class="form-control" id="institute" placeholder="Enter full name of the institution" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Short Name (e.g., DHIC) *</label>
                        <input type="text" class="form-control" id="shortName" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Number of Classes *</label>
                        <input type="number" class="form-control" id="classes" placeholder="e.g., 5" required>
                    </div>
                    
                    <div class="col-12 mt-4 mb-2" style="border-bottom: 1px dashed #ddd;"></div>
                    
                    <div class="col-md-6">
                        <label class="form-label">Contact Person Name *</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Designation *</label>
                        <input type="text" class="form-control" id="designation" placeholder="e.g., Principal / Admin" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone Number (WhatsApp) *</label>
                        <input type="tel" class="form-control" id="phone" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email Address *</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    
                    <div class="col-12 mt-4 mb-2" style="border-bottom: 1px dashed #ddd;"></div>
                    
                    <div class="col-md-12">
                        <label class="form-label">Select a Plan *</label>
                        <select class="form-select" id="plan" required style="border-color: var(--logo-orange);">
                            <option value="" disabled selected>Choose a Plan...</option>
                            <option value="Term Plan">Term Plan (₹99 / Class)</option>
                            <option value="Annual Plan">Annual Plan (₹450 / Class) - Best Value</option>
                        </select>
                    </div>
                    
                    <div class="col-12 mt-4">
                        <button type="submit" class="btn-submit" id="submitBtn">
                            <i class="fas fa-paper-plane me-2"></i> Submit Registration
                        </button>
                    </div>
                    <div class="col-12 text-center mt-4">
                        <a href="index.html" style="color: #666; text-decoration: none; font-size: 13px; font-weight: 600;"><i class="fas fa-arrow-left me-1"></i> Back to Home</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxNL1AyCgayAFaVIuNErX5Bm7OpkWHpcPs7i1XBXB-gIZUu1jxG88gEYeHaVYEMV2INAg/exec";

        async function submitForm(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Submitting Request...';
            btn.disabled = true;

            const payload = {
                action: 'register',
                data: {
                    institute: document.getElementById('institute').value.trim(),
                    shortName: document.getElementById('shortName').value.trim().toUpperCase(),
                    classes: document.getElementById('classes').value.trim(),
                    name: document.getElementById('name').value.trim(),
                    designation: document.getElementById('designation').value.trim(),
                    phone: document.getElementById('phone').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    plan: document.getElementById('plan').value
                }
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const res = await response.json();

                if (res.success) {
                    Swal.fire({
                        title: 'Request Submitted!',
                        text: res.message,
                        icon: 'success',
                        confirmButtonColor: '#00A651'
                    }).then(() => {
                        document.getElementById('registerForm').reset();
                        window.location.href = 'index.html'; 
                    });
                } else {
                    Swal.fire('Error', res.message, 'error');
                    btn.innerHTML = '<i class="fas fa-paper-plane me-2"></i> Submit Registration';
                    btn.disabled = false;
                }
            } catch (error) {
                Swal.fire('Error', 'Unable to connect to the server. Please check your internet connection.', 'error');
                btn.innerHTML = '<i class="fas fa-paper-plane me-2"></i> Submit Registration';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
