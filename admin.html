<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin | ResultVue</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --primary: #12224A; --success: #00A651; --warning: #F58220; --bg: #f4f7f6; }
        * { font-family: system-ui, -apple-system, 'Segoe UI', 'Anek Malayalam', sans-serif !important; }
        body { background: linear-gradient(135deg, #f4f7f6 0%, #e8f5e9 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .admin-card { background: white; padding: 40px 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border-top: 5px solid var(--warning); width: 100%; max-width: 450px; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h2 { color: var(--primary); margin: 0 0 5px 0; font-weight: 800; }
        .header p { color: #666; margin: 0; font-size: 14px; font-weight: 600; }
        .input-group { position: relative; margin-bottom: 15px; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #999; }
        input, select { width: 100%; padding: 12px 12px 12px 40px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; background: #fafafa; transition: 0.3s; }
        input:focus, select:focus { border-color: var(--primary); outline: none; background: #fff; box-shadow: 0 0 0 3px rgba(18,34,74,0.1); }
        button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; text-transform: uppercase; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #0A1430; transform: translateY(-2px); }
        .password-section { border-top: 2px dashed #ddd; margin-top: 20px; padding-top: 20px; }
    </style>
</head>
<body>
    <div class="admin-card">
        <div class="header">
            <h2>SUPER ADMIN</h2>
            <p><i class="fas fa-plus-circle text-warning"></i> Add New Institution</p>
        </div>
        
        <form id="addSchoolForm" onsubmit="handleFormSubmit(event)">
            <div class="input-group">
                <i class="fas fa-id-badge"></i>
                <input type="text" id="schoolId" placeholder="School ID (e.g., RVDEMO)" required autocomplete="off" style="text-transform: uppercase;">
            </div>
            <div class="input-group">
                <i class="fas fa-school"></i>
                <input type="text" id="schoolName" placeholder="Institution Name" required autocomplete="off">
            </div>
            <div class="input-group">
                <i class="fas fa-user-shield"></i>
                <input type="text" id="username" placeholder="Admin Username" required autocomplete="off">
            </div>
            <div class="input-group">
                <i class="fas fa-key"></i>
                <input type="text" id="password" placeholder="Admin Password" required autocomplete="off">
            </div>
            <div class="input-group">
                <i class="fas fa-database"></i>
                <input type="text" id="spreadsheetId" placeholder="Google Sheet ID" required autocomplete="off">
            </div>
            <div class="input-group">
                <i class="fas fa-toggle-on"></i>
                <select id="status" required>
                    <option value="Active">🟢 Active (Portal Open)</option>
                    <option value="Inactive">🔴 Inactive (Blocked)</option>
                </select>
            </div>
            
            <div class="password-section">
                <div class="input-group">
                    <i class="fas fa-lock text-danger"></i>
                    <input type="password" id="superAdminPassword" placeholder="Enter Super Admin Password" required autocomplete="off">
                </div>
            </div>
            
            <button type="submit" id="submitBtn"><i class="fas fa-cloud-upload-alt"></i> Save to Database</button>
            <a href="index.html" style="display: flex; justify-content: center; margin-top: 20px; color: #666; text-decoration: none; font-size: 13px; font-weight: 600;">
    <i class="fas fa-arrow-left" style="margin-right: 5px; margin-top: 3px;"></i> Back to Home
</a>
        </form>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxNL1AyCgayAFaVIuNErX5Bm7OpkWHpcPs7i1XBXB-gIZUu1jxG88gEYeHaVYEMV2INAg/exec";

        async function handleFormSubmit(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            btn.disabled = true;
            
            const payload = {
                action: 'addSchool',
                superAdminPassword: document.getElementById('superAdminPassword').value.trim(),
                data: {
                    schoolId: document.getElementById('schoolId').value.toUpperCase().trim(),
                    schoolName: document.getElementById('schoolName').value.trim(),
                    username: document.getElementById('username').value.trim(),
                    password: document.getElementById('password').value.trim(),
                    spreadsheetId: document.getElementById('spreadsheetId').value.trim(),
                    status: document.getElementById('status').value
                }
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                
                if(result.success) {
                    Swal.fire('Success!', result.message, 'success');
                    document.getElementById('addSchoolForm').reset();
                } else {
                    Swal.fire('Error!', result.message, 'error');
                }
            } catch (error) {
                Swal.fire('Connection Error!', 'Failed to connect to the server.', 'error');
            } finally {
                btn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Save to Database';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
